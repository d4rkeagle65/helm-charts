apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "manictime-server.fullname" . }}
  labels:
    {{- include "manictime-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "manictime-server.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        {{- include "manictime-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "manictime-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- $seedSecret := "" }}
      {{- if .Values.settings.existingSecret }}
        {{- $seedSecret = .Values.settings.existingSecret }}
      {{- else if .Values.settings.seed }}
        {{- $seedSecret = printf "%s-settings" (include "manictime-server.fullname" .) }}
      {{- end }}
      {{- if and .Values.persistence.enabled $seedSecret }}
      initContainers:
        - name: seed-settings
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/Data/ManicTimeServerSettings.json ]; then
                cp /seed/ManicTimeServerSettings.json /app/Data/ManicTimeServerSettings.json
                echo "Seeded ManicTimeServerSettings.json from Secret {{ $seedSecret }}"
              else
                echo "ManicTimeServerSettings.json already present, leaving it alone"
              fi
          volumeMounts:
            - name: data
              mountPath: /app/Data
            - name: settings-seed
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.env }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.additionalVolumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - mountPath: {{ .Values.persistence.mountPath }}
              name: data
            {{- end }}
          {{- with .Values.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.additionalVolumes $seedSecret }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "manictime-server.fullname" . }}-data
        {{- end }}
        {{- if and .Values.persistence.enabled $seedSecret }}
        - name: settings-seed
          secret:
            secretName: {{ $seedSecret }}
        {{- end }}
      {{- with .Values.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
