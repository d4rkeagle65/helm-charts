{{- if and .Values.settings.seed (not .Values.settings.existingSecret) -}}
{{- $db := .Values.settings.database -}}
{{- $pw := $db.password -}}
{{- if and $db.passwordSecret $db.passwordSecret.name -}}
{{- $sec := (lookup "v1" "Secret" .Release.Namespace $db.passwordSecret.name) -}}
{{- if and $sec (index $sec.data $db.passwordSecret.key) -}}
{{- $pw = index $sec.data $db.passwordSecret.key | b64dec -}}
{{- end -}}
{{- end -}}
{{- $core := printf "Host=%s; Port=%v; Database=%s; SSL Mode=%s; User Id=%s; Password=%s;" $db.host $db.port $db.coreDatabase $db.sslMode $db.user $pw -}}
{{- $reports := printf "Host=%s; Port=%v; Database=%s; SSL Mode=%s; User Id=%s; Password=%s;" $db.host $db.port $db.reportsDatabase $db.sslMode $db.user $pw -}}
{{- $base := dict "database" (dict "provider" "PostgreSql" "connectionString" $core) "reporting" (dict "database" (dict "provider" "PostgreSql" "connectionString" $reports)) -}}
{{- $merged := mergeOverwrite $base .Values.settings.extra -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manictime-server.fullname" . }}-settings
  labels:
    {{- include "manictime-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  ManicTimeServerSettings.json: |
{{ toPrettyJson $merged | indent 4 }}
{{- end }}
